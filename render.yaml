# ==============================================================================
# Render Blueprint Specification for Self-Hosted Chatwoot
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Chatwoot Web Service (Rails Puma Application)
  # ----------------------------------------------------------------------------
  - type: web
    name: chatwoot-web
    runtime: image
    image:
      url: chatwoot/chatwoot:latest
    plan: starter
    region: oregon
    healthCheckPath: /health_check
    # Runs the Chatwoot rails entrypoint script and starts the web server
    dockerCommand: docker/entrypoints/rails.sh bundle exec rails s -p 3000 -b 0.0.0.0
    # Runs database migrations and seeds automatically before each deployment
    preDeployCommand: bundle exec rails db:chatwoot_prepare
    envVars:
      - key: RAILS_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: INSTALLATION_ENV
        value: render
      - key: FORCE_SSL
        value: "true"
      - key: PORT
        value: "3000"
      - key: ACTIVE_STORAGE_SERVICE
        value: local
      # Automatically generated secure secret key base for Rails cookies & sessions
      - key: SECRET_KEY_BASE
        generateValue: true
      # Update to your live Render web service URL or custom domain
      - key: FRONTEND_URL
        value: https://chatwoot-web.onrender.com
      # External Aiven PostgreSQL Connection URL (Render will prompt for input during setup)
      - key: DATABASE_URL
        sync: false
      # Divided PostgreSQL variables required by Chatwoot config/database.yml
      - key: POSTGRES_HOST
        value: pg-161848d2-youssefmohamedaly750-2283.d.aivencloud.com
      - key: POSTGRES_PORT
        value: "17536"
      - key: POSTGRES_USERNAME
        value: avnadmin
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DATABASE
        value: defaultdb
      - key: PGSSLMODE
        value: require
      - key: POSTGRES_SSLMODE
        value: require
      # Redis connection string injected from managed Redis below
      - key: REDIS_URL
        fromService:
          type: redis
          name: chatwoot-redis
          property: connectionString
      # Required for Redis TLS connections on cloud providers
      - key: REDIS_OPENSSL_VERIFY_MODE
        value: none
      - key: RAILS_MAX_THREADS
        value: "5"
    disk:
      name: chatwoot-web-storage
      mountPath: /app/storage
      sizeGB: 10

  # ----------------------------------------------------------------------------
  # 2. Chatwoot Background Worker (Sidekiq)
  # ----------------------------------------------------------------------------
  - type: worker
    name: chatwoot-worker
    runtime: image
    image:
      url: chatwoot/chatwoot:latest
    plan: starter
    region: oregon
    # Starts the background job processor
    dockerCommand: bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      - key: RAILS_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: INSTALLATION_ENV
        value: render
      - key: FORCE_SSL
        value: "true"
      - key: ACTIVE_STORAGE_SERVICE
        value: local
      # Shares the same SECRET_KEY_BASE generated by the web service
      - key: SECRET_KEY_BASE
        fromService:
          type: web
          name: chatwoot-web
          envVarKey: SECRET_KEY_BASE
      - key: FRONTEND_URL
        fromService:
          type: web
          name: chatwoot-web
          envVarKey: FRONTEND_URL
      # Inherit PostgreSQL database variables from web service
      - key: DATABASE_URL
        fromService:
          type: web
          name: chatwoot-web
          envVarKey: DATABASE_URL
      - key: POSTGRES_HOST
        fromService:
          type: web
          name: chatwoot-web
          envVarKey: POSTGRES_HOST
      - key: POSTGRES_PORT
        fromService:
          type: web
          name: chatwoot-web
          envVarKey: POSTGRES_PORT
      - key: POSTGRES_USERNAME
        fromService:
          type: web
          name: chatwoot-web
          envVarKey: POSTGRES_USERNAME
      - key: POSTGRES_PASSWORD
        fromService:
          type: web
          name: chatwoot-web
          envVarKey: POSTGRES_PASSWORD
      - key: POSTGRES_DATABASE
        fromService:
          type: web
          name: chatwoot-web
          envVarKey: POSTGRES_DATABASE
      - key: PGSSLMODE
        value: require
      - key: POSTGRES_SSLMODE
        value: require
      - key: REDIS_URL
        fromService:
          type: redis
          name: chatwoot-redis
          property: connectionString
      - key: REDIS_OPENSSL_VERIFY_MODE
        value: none
    disk:
      name: chatwoot-worker-storage
      mountPath: /app/storage
      sizeGB: 10

  # ----------------------------------------------------------------------------
  # 3. Managed Redis (for Sidekiq job queue, cache, ActionCable WebSockets)
  # ----------------------------------------------------------------------------
  - type: redis
    name: chatwoot-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
