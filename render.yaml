# ==============================================================================
# Render Blueprint Specification for Self-Hosted Chatwoot
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Chatwoot Web Service (Rails Puma Application)
  # ----------------------------------------------------------------------------
  - type: web
    name: chatwoot-web
    runtime: image
    image:
      url: chatwoot/chatwoot:latest
    plan: starter
    region: oregon
    healthCheckPath: /health_check
    # Runs the Chatwoot rails entrypoint script and starts the web server
    dockerCommand: docker/entrypoints/rails.sh bundle exec rails s -p 3000 -b 0.0.0.0
    # Runs database migrations and seeds automatically before each deployment
    preDeployCommand: bundle exec rails db:chatwoot_prepare
    envVars:
      - key: RAILS_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: INSTALLATION_ENV
        value: render
      - key: FORCE_SSL
        value: "true"
      - key: PORT
        value: "3000"
      - key: ACTIVE_STORAGE_SERVICE
        value: local
      # Automatically generated secure secret key base for Rails cookies & sessions
      - key: SECRET_KEY_BASE
        generateValue: true
      # Update to your live Render web service URL or custom domain
      - key: FRONTEND_URL
        value: https://chatwoot-web.onrender.com
      # Postgres database connection string injected from managed database below
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-postgres
          property: connectionString
      # Redis connection string injected from managed Redis below
      - key: REDIS_URL
        fromService:
          type: redis
          name: chatwoot-redis
          property: connectionString
      # Required for Redis TLS connections on cloud providers
      - key: REDIS_OPENSSL_VERIFY_MODE
        value: none
      - key: RAILS_MAX_THREADS
        value: "5"
    disk:
      name: chatwoot-web-storage
      mountPath: /app/storage
      sizeGB: 10

  # ----------------------------------------------------------------------------
  # 2. Chatwoot Background Worker (Sidekiq)
  # ----------------------------------------------------------------------------
  - type: worker
    name: chatwoot-worker
    runtime: image
    image:
      url: chatwoot/chatwoot:latest
    plan: starter
    region: oregon
    # Starts the background job processor
    dockerCommand: bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      - key: RAILS_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: INSTALLATION_ENV
        value: render
      - key: FORCE_SSL
        value: "true"
      - key: ACTIVE_STORAGE_SERVICE
        value: local
      # Shares the same SECRET_KEY_BASE generated by the web service
      - key: SECRET_KEY_BASE
        fromService:
          type: web
          name: chatwoot-web
          envVarKey: SECRET_KEY_BASE
      - key: FRONTEND_URL
        fromService:
          type: web
          name: chatwoot-web
          envVarKey: FRONTEND_URL
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: chatwoot-redis
          property: connectionString
      - key: REDIS_OPENSSL_VERIFY_MODE
        value: none
    disk:
      name: chatwoot-worker-storage
      mountPath: /app/storage
      sizeGB: 10

  # ----------------------------------------------------------------------------
  # 3. Managed Redis (for Sidekiq job queue, cache, ActionCable WebSockets)
  # ----------------------------------------------------------------------------
  - type: redis
    name: chatwoot-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

# ------------------------------------------------------------------------------
# 4. Managed PostgreSQL Database (Version 15, UTF-8 Collation)
# ------------------------------------------------------------------------------
databases:
  - name: chatwoot-postgres
    region: oregon
    plan: starter
    databaseName: chatwoot_production
    user: chatwoot
    postgresMajorVersion: "15"
    ipAllowList: []
